          name: hỏi thông tin chung có trong tài liệu (chỉ tiêu, mã ngành, tổ hợp, phương thức, lịch, học phí). Không gồm câu có điểm riêng của người hỏi, hoặc con số người hỏi nghe được và muốn xác nhận.
        - id: '2'
          label: Tư vấn cá nhân
          name: có điểm hoặc hoàn cảnh riêng của người hỏi, cần tính toán hoặc gợi ý theo người đó; hoặc người hỏi nêu một con số nghe được và muốn xác nhận.
        - id: '3'
          label: Nhạy cảm
          name: khiếu nại, tố cáo, đòi cam kết kết quả, hỏi cách lo điểm.
        - id: '4'
          label: Khác
          name: không liên quan đến tuyển sinh của trường, ví dụ đi lại, ăn ở, thời tiết, bài tập.
        desc: ''
        instruction: 'Câu vừa hỏi thông tin chung vừa có điểm riêng thì chọn Tư vấn cá nhân.

          Câu có yếu tố khiếu nại hoặc đòi cam kết thì luôn chọn Nhạy cảm.

          Câu nêu một con số nghe được rồi hỏi có đúng không thì luôn chọn Tư vấn cá nhân, không chọn Tra cứu.

          "Em 26 điểm có được miễn học phí không?" → Tư vấn cá nhân

          "Học phí Công nghệ Giáo dục bao nhiêu?" → Tra cứu

          "Điểm chuẩn vô lý, em muốn khiếu nại" → Nhạy cảm

          "Nghe nói ngành Luật tuyển 500, có đúng không?" → Tư vấn cá nhân

          "Quán cơm nào gần trường ngon?" → Khác'
